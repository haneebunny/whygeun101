spring:
  profiles:
    active: dev
  h2:
    console:
      enabled: false

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    # 내 컴퓨터면 H2를 쓰고, Render(환경변수)면 그 주소를 쓰도록 자동 분기
    url: ${DB_URL:jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      # 실서버 환경변수(JPA_DDL)가 있으면 쓰고, 없으면 로컬 기본값으로 create를 사용
      ddl-auto: ${JPA_DDL:create}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 토큰 서명에 사용할 비밀키 (실무에서는 엄청 길고 복잡한 영문/숫자 조합 사용)
  secret: ${JWT_SECRET:super-secret-key-for-fieldwork-101-hanibe-application}

kakao:
  # 카카오 디벨로퍼스에서 발급받은 REST API 키
  client-id: ${KAKAO_REST_API_KEY:543622ef4fa082724af123eddd102943}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${LLM_MODEL:gpt-5.4-mini}